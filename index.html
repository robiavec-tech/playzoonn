<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1020"><meta name="description" content="PLAYZOONN Discovery : découvre des ressources GTA VI, des cartes, des créateurs et des outils gaming.">
<title>PLAYZOONN — Gaming Discovery</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#171e32;--line:#343b55;--purple:#a294ff;--muted:#b2bad0;--white:#f7f5ff}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--white);background:radial-gradient(ellipse 85% 470px at 50% 0,#33235d 0,#16162b 52%,var(--bg) 100%);font:16px/1.55 system-ui,-apple-system,Segoe UI,Arial,sans-serif}
a{color:#c4b7ff}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #d3caff;outline-offset:3px}
.container{width:min(1120px,calc(100% - 36px));margin:auto}
.top{position:sticky;top:0;z-index:5;background:#0b1020eb;backdrop-filter:blur(16px);border-bottom:1px solid #ffffff18}
.top-inner{display:flex;justify-content:space-between;align-items:center;gap:16px;min-height:72px}.logo{font-size:24px;letter-spacing:.035em;font-weight:900;text-decoration:none;color:var(--purple)}.nav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.nav a{padding:8px 10px;text-decoration:none;color:#ddd8fa;font-size:14px;border-radius:10px}.nav a:hover{background:#ffffff15}
select,input{border:1px solid #655b88;background:#1c2036;color:white;border-radius:12px;padding:12px}
.hero{padding:70px 0 44px;text-align:center}.eyebrow{display:inline-block;border:1px solid #a294ff77;border-radius:99px;padding:5px 14px;background:#a294ff18;color:#d7ccff;font-weight:700;font-size:12px;letter-spacing:.12em}
h1{font-size:clamp(36px,6vw,66px);line-height:1.1;letter-spacing:-.035em;margin:20px auto;max-width:840px}.accent{color:#ae9bff}.hero p{color:var(--muted);max-width:630px;margin:0 auto 25px;font-size:18px}.search{width:min(100%,640px);padding:16px 18px;font-size:16px;box-shadow:0 12px 35px #0003}
.metrics{display:flex;justify-content:center;gap:26px;flex-wrap:wrap;margin-top:24px;color:#b9b1d5;font-size:14px}.metrics strong{color:#fff}
section{scroll-margin-top:92px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin:20px 0}.section-head h2{font-size:clamp(23px,3vw,30px);margin:0;letter-spacing:-.02em}.section-sub{margin:0 0 18px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#1c2139,#15192d);padding:19px;min-width:0;transition:border-color .15s,transform .15s}.card:hover{border-color:#8d7be0;transform:translateY(-2px)}
.category{color:var(--white);text-align:left;width:100%}.category[aria-pressed=true]{border-color:var(--purple);background:#292044}.category .emoji{font-size:27px}.category strong{display:block;margin-top:10px}.category small{display:block;color:var(--muted);margin-top:3px}
.featured{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.feature{min-height:190px;background:linear-gradient(145deg,#3a2b65,#1b2440);display:flex;flex-direction:column;justify-content:space-between}.feature:nth-child(2){background:linear-gradient(145deg,#233b62,#1b2440)}.feature:nth-child(3){background:linear-gradient(145deg,#44315e,#1b2440)}.feature .icon{font-size:30px}.feature h3{margin:8px 0}.feature p{color:#e0dbf0;font-size:14px;margin:0 0 14px}.feature a{font-weight:700;text-decoration:none}
.library{margin-top:45px}.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.chip{padding:9px 14px;border:1px solid #666080;border-radius:99px;background:#1b2036;color:#e7e3fa}.chip[aria-pressed=true]{background:#57458c;border-color:#b3a0ff}.results{color:var(--muted);margin-left:auto;font-size:14px}
.resource{display:flex;flex-direction:column;min-height:206px}.resource .topline{display:flex;justify-content:space-between;align-items:center;gap:8px}.tag{font-size:12px;color:#d5c9ff;border:1px solid #70648e;padding:3px 9px;border-radius:99px}.fav{border:1px solid #655b88;border-radius:10px;background:#29263f;color:#c7c0dc;padding:5px 10px;font-size:20px;line-height:1.2}.fav[aria-pressed=true]{color:#ffd66c;border-color:#b49455}.resource h3{font-size:17px;line-height:1.3;margin:15px 0 7px}.resource p{color:var(--muted);font-size:14px;margin:0 0 18px;flex:1}.resource a{font-size:14px;font-weight:700;text-decoration:none}.resource a:hover,.feature a:hover{text-decoration:underline}
.shelf{margin:0 0 30px}.shelf-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px}.shelf-head h3{font-size:21px;margin:0}.shelf-controls{display:flex;gap:7px}.shelf-arrow{background:#292341;color:#fff;border:1px solid #6b608d;border-radius:10px;min-width:38px;height:36px;font-size:23px;line-height:1}.shelf-arrow:hover{background:#51417c}.shelf-track{display:flex;gap:14px;overflow-x:auto;overscroll-behavior-inline:contain;scroll-snap-type:x mandatory;scrollbar-width:thin;scrollbar-color:#74649e transparent;padding:2px 2px 14px}.shelf-track .resource{flex:0 0 clamp(215px,24%,270px);scroll-snap-align:start}.featured{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px}.featured .feature{flex:0 0 clamp(230px,32%,355px);scroll-snap-align:start}.empty{padding:28px;border:1px dashed #6b6484;border-radius:14px;color:var(--muted);text-align:center}
.footer{border-top:1px solid var(--line);margin-top:70px;padding:30px 0;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
@media(max-width:850px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.featured{grid-template-columns:repeat(2,minmax(0,1fr))}.nav a{display:none}}
@media(max-width:580px){.shelf-track .resource{flex-basis:76vw}.featured .feature{flex-basis:80vw}.shelf-head h3{font-size:19px}.shelf-arrow{min-width:34px;height:34px} .top-inner{min-height:64px}.logo{font-size:20px}.container{width:min(100% - 28px,1120px)}.hero{padding:44px 0 35px}.hero p{font-size:16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.featured{grid-template-columns:1fr}.card{padding:15px}.resource{min-height:210px}.results{width:100%;margin-left:0}}
@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header class="top"><div class="container top-inner"><a class="logo" href="#home">PLAYZOONN</a><nav class="nav" aria-label="Navigation"><a href="#discover" id="navDiscover"></a><a href="#categories" id="navCategories"></a><a href="#library" id="navLibrary"></a><select id="language" aria-label="Language"><option value="fr">FR 🇫🇷</option><option value="en">EN 🇬🇧</option></select></nav></div></header>
<main class="container"><section id="home" class="hero"><span class="eyebrow">PLAYZOONN DISCOVERY</span><h1 id="heroTitle"></h1><p id="heroText"></p><input id="search" class="search" type="search" autocomplete="off" aria-label="Search resources"><div class="metrics"><span><strong id="totalCount"></strong> <span id="metricResources"></span></span><span><strong>5</strong> <span id="metricCategories"></span></span><span>★ <strong id="favoriteCount">0</strong> <span id="metricFavorites"></span></span></div></section>
<section id="discover"><div class="section-head"><h2 id="discoverTitle"></h2></div><p class="section-sub" id="discoverSubtitle"></p><div id="featured" class="featured"></div></section>
<section id="categories" style="margin-top:48px"><div class="section-head"><h2 id="categoriesTitle"></h2></div><div id="categoryGrid" class="grid"></div></section>
<section id="library" class="library"><div class="section-head"><h2 id="libraryTitle"></h2></div><div class="toolbar" id="filters"><button class="chip" data-filter="all" aria-pressed="true"></button><button class="chip" data-filter="favorites" aria-pressed="false"></button><button class="chip" data-filter="news" aria-pressed="false"></button><button class="chip" data-filter="creators" aria-pressed="false"></button><button class="chip" data-filter="tools" aria-pressed="false"></button><button class="chip" data-filter="maps" aria-pressed="false"></button><button class="chip" data-filter="sites" aria-pressed="false"></button><span class="results" id="resultCount"></span></div><div id="resourceGrid" class="grid"></div><p class="empty" id="empty" hidden></p></section></main>
<footer class="footer"><div class="container" id="footerText"></div></footer>
<script>
'use strict';
const resources=[["news","Rockstar Newswire","https://www.rockstargames.com/newswire","Actualités officielles Rockstar"],["news","Rockstar GTA VI","https://www.rockstargames.com/VI","Informations officielles GTA VI"],["news","IGN GTA VI","https://www.ign.com/games/grand-theft-auto-vi","Articles et actualités"],["news","GameSpot GTA VI","https://www.gamespot.com/games/grand-theft-auto-vi/","Actualités et analyses"],["news","GTA Base News","https://www.gtabase.com/","Dossiers et informations GTA"],["creators","Rockstar Games YouTube","https://www.youtube.com/@RockstarGames","Vidéos officielles"],["creators","GTA Series Videos","https://www.youtube.com/@GTASeriesVideos","Vidéos et guides GTA"],["creators","DarkViperAU","https://www.youtube.com/@DarkViperAU","Défis et analyses GTA"],["creators","TGG","https://www.youtube.com/@TGG_","Conseils et vidéos GTA"],["creators","Communauté GTA6","https://www.reddit.com/r/GTA6/","Discussions entre fans"],["tools","GTA Wiki","https://gta.fandom.com/wiki/Grand_Theft_Auto_Wiki","Encyclopédie et astuces GTA"],["tools","GTA Forums","https://gtaforums.com/","Techniques et échanges communautaires"],["tools","GTA Series Guides","https://www.youtube.com/@GTASeriesVideos","Guides vidéo"],["tools","GTA Base Guides","https://www.gtabase.com/","Dossiers et conseils"],["maps","GTAMap","https://gtamap.io/","Projet de carte communautaire"],["maps","GTA Base Maps","https://www.gtabase.com/","Cartes et lieux des jeux GTA"],["maps","GTA Wiki Locations","https://gta.fandom.com/wiki/Locations","Encyclopédie des lieux GTA"],["maps","Rockstar GTA VI World","https://www.rockstargames.com/VI","Présentation officielle de l'univers"],["sites","Rockstar Games","https://www.rockstargames.com/","Site officiel"],["sites","GTA Base","https://www.gtabase.com/","Base de données GTA"],["sites","GTA Forums","https://gtaforums.com/","Forum communautaire"],["sites","GTA Wiki","https://gta.fandom.com/","Wiki des jeux GTA"]];
const categories=[['news','📰','Actualités','News'],['creators','🎥','Créateurs','Creators'],['tools','🛠️','Outils / Glitch','Tools / Glitches'],['maps','🗺️','Maps','Maps'],['sites','🌐','Sites web','Websites']];
const strings={
fr:{heroTitle:'Ton prochain univers <span class="accent">gaming</span> commence ici.',heroText:'Explore GTA 6 autrement : les meilleurs points de départ pour suivre les actualités, découvrir des créateurs, explorer des cartes et retrouver tes ressources préférées.',search:'Rechercher un site, un créateur, une carte...',metricResources:'ressources',metricCategories:'catégories',metricFavorites:'favoris',discoverTitle:'✨ À découvrir',discoverSubtitle:'Une sélection pour commencer à explorer.',categoriesTitle:'Explore par catégorie',libraryTitle:'Toutes les ressources',navDiscover:'Découvrir',navCategories:'Catégories',navLibrary:'Ressources',all:'Tout',favorites:'★ Mes favoris',visit:'Explorer ↗',empty:'Aucune ressource trouvée. Essaie un autre filtre ou une autre recherche.',result:'résultats',footer:'© 2026 PLAYZOONN · Plateforme indépendante de découverte gaming. Non affiliée à Rockstar Games. Les ressources externes appartiennent à leurs éditeurs.',featured:[['🎮','L’univers officiel GTA VI','Découvre les annonces et les présentations de Rockstar.'],['🗺️','Explorer les cartes','Retrouve des ressources pour découvrir les lieux du jeu.'],['🎥','Les créateurs GTA','Explore des vidéos, analyses et communautés.']]},
en:{heroTitle:'Your next <span class="accent">gaming</span> universe starts here.',heroText:'Explore GTA 6 differently: follow the news, find creators, explore maps and save your favorite resources.',search:'Search sites, creators, maps...',metricResources:'resources',metricCategories:'categories',metricFavorites:'favorites',discoverTitle:'✨ Discover',discoverSubtitle:'A handpicked starting point for your next discovery.',categoriesTitle:'Explore by category',libraryTitle:'All resources',navDiscover:'Discover',navCategories:'Categories',navLibrary:'Resources',all:'All',favorites:'★ My favorites',visit:'Explore ↗',empty:'No matching resources. Try another filter or search.',result:'results',footer:'© 2026 PLAYZOONN · Independent gaming discovery platform. Not affiliated with Rockstar Games. External resources belong to their publishers.',featured:[['🎮','Official GTA VI world','Discover Rockstar announcements and previews.'],['🗺️','Explore maps','Find resources to discover game locations.'],['🎥','GTA creators','Explore videos, analysis and communities.']]}
};
const $=id=>document.getElementById(id);
let filter='all';
let favorites=[];
try{const saved=JSON.parse(localStorage.getItem('playzoonn-favorites-v1')||'[]');if(Array.isArray(saved))favorites=saved.filter(x=>typeof x==='string')}catch(e){}
const idOf=r=>r[0]+'|'+r[1];
function saveFavorites(){try{localStorage.setItem('playzoonn-favorites-v1',JSON.stringify(favorites))}catch(e){}}
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function render(){
const lang=$('language').value,t=strings[lang],query=$('search').value.trim().toLocaleLowerCase();document.documentElement.lang=lang;
$('heroTitle').innerHTML=t.heroTitle;
for(const key of ['heroText','metricResources','metricCategories','metricFavorites','discoverTitle','discoverSubtitle','categoriesTitle','libraryTitle','navDiscover','navCategories','navLibrary'])$(key).textContent=t[key];
$('search').placeholder=t.search;$('footerText').textContent=t.footer;$('totalCount').textContent=resources.length;$('favoriteCount').textContent=favorites.length;
const featuredIds=[1,14,6];$('featured').replaceChildren();
featuredIds.forEach((idx,i)=>{const r=resources[idx],f=t.featured[i],card=make('article','card feature'),symbol=make('div','icon',f[0]),body=make('div'),h=make('h3','',f[1]),p=make('p','',f[2]),a=make('a','',t.visit);a.href=r[2];a.target='_blank';a.rel='noopener noreferrer';body.append(h,p,a);card.append(symbol,body);$('featured').append(card)});
$('categoryGrid').replaceChildren();
categories.forEach(c=>{const count=resources.filter(r=>r[0]===c[0]).length,b=make('button','card category'),emoji=make('span','emoji',c[1]),title=make('strong','',c[lang==='fr'?2:3]),sub=make('small','',count+' '+t.metricResources);b.type='button';b.setAttribute('aria-pressed',String(filter===c[0]));b.append(emoji,title,sub);b.onclick=()=>{filter=filter===c[0]?'all':c[0];render();$('library').scrollIntoView({behavior:'smooth'})};$('categoryGrid').append(b)});
document.querySelectorAll('[data-filter]').forEach(b=>{const key=b.dataset.filter,c=categories.find(x=>x[0]===key);b.textContent=key==='all'?t.all:key==='favorites'?t.favorites:c[lang==='fr'?2:3];b.setAttribute('aria-pressed',String(filter===key))});
$('resourceGrid').replaceChildren();let count=0;
const matching=resources.filter(r=>{const id=idOf(r),cat=categories.find(c=>c[0]===r[0]);if(filter==='favorites'&&!favorites.includes(id))return false;if(filter!=='favorites'&&filter!=='all'&&r[0]!==filter)return false;return !query||[...r,...cat].join(' ').toLocaleLowerCase().includes(query)});
count=matching.length;
const groups=(filter==='all'||filter==='favorites')?categories.filter(c=>matching.some(r=>r[0]===c[0])):categories.filter(c=>c[0]===filter&&matching.some(r=>r[0]===c[0]));
groups.forEach(cat=>{
const section=make('section','shelf'),head=make('div','shelf-head'),heading=make('h3','',cat[1]+' '+cat[lang==='fr'?2:3]),controls=make('div','shelf-controls'),left=make('button','shelf-arrow','‹'),right=make('button','shelf-arrow','›'),track=make('div','shelf-track');
left.type='button';right.type='button';left.setAttribute('aria-label',lang==='fr'?'Défiler à gauche':'Scroll left');right.setAttribute('aria-label',lang==='fr'?'Défiler à droite':'Scroll right');
left.onclick=()=>track.scrollBy({left:-track.clientWidth*.85,behavior:'smooth'});right.onclick=()=>track.scrollBy({left:track.clientWidth*.85,behavior:'smooth'});
controls.append(left,right);head.append(heading,controls);section.append(head,track);
matching.filter(r=>r[0]===cat[0]).forEach(r=>{
const id=idOf(r),card=make('article','card resource'),top=make('div','topline'),tag=make('span','tag',cat[lang==='fr'?2:3]),star=make('button','fav',favorites.includes(id)?'★':'☆');
star.type='button';star.setAttribute('aria-label',(favorites.includes(id)?'Remove favorite: ':'Add favorite: ')+r[1]);star.setAttribute('aria-pressed',String(favorites.includes(id)));
star.onclick=()=>{favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];saveFavorites();star.textContent=favorites.includes(id)?'★':'☆';star.setAttribute('aria-pressed',String(favorites.includes(id)));$('favoriteCount').textContent=favorites.length;if(filter==='favorites')render()};
top.append(tag,star);const h=make('h3','',r[1]),p=make('p','',r[3]),a=make('a','',t.visit);a.href=r[2];a.target='_blank';a.rel='noopener noreferrer';card.append(top,h,p,a);track.append(card)});
$('resourceGrid').append(section)});
$('resultCount').textContent=count+' '+t.result;$('empty').textContent=t.empty;$('empty').hidden=count!==0;
}
document.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.filter;render()}));
$('search').addEventListener('input',render);$('language').addEventListener('change',render);render();
</script></body></html>
