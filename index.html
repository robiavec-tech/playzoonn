<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="PLAYZOONN, annuaire indépendant de ressources GTA VI"><title>PLAYZOONN — Gaming Directory</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#171e32;--line:#303952;--purple:#a294ff;--muted:#aeb7cd}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#211b3e,var(--bg) 65%);font:16px/1.55 system-ui,Arial,sans-serif;color:white}header{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:20px 6%;border-bottom:1px solid var(--line)}.logo{color:var(--purple);font-size:26px;font-weight:800;text-decoration:none}main{max-width:1100px;margin:auto;padding:25px 20px}.hero{text-align:center;padding:38px 0 24px}h1{font-size:clamp(32px,6vw,55px);line-height:1.15;margin:10px 0}.accent{color:var(--purple)}p{color:var(--muted)}input,select,button{font:inherit}input,select{background:var(--panel);color:white;border:1px solid #55516f;border-radius:10px;padding:12px}#search{width:min(100%,620px);margin-top:18px}h2{margin:30px 0 15px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.category{color:white;text-align:left;cursor:pointer}.category:hover,.category[aria-pressed=true]{border-color:var(--purple);background:#26213f}.category strong{display:block;margin-top:6px}.emoji{font-size:27px}.resource h3{margin:8px 0}.resource p{font-size:14px;min-height:45px}.resource a{color:#b9aaff;font-weight:650}.tag{font-size:12px;color:#c7baff;border:1px solid #63588d;padding:3px 9px;border-radius:20px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.reset{border:1px solid #63588d;background:transparent;color:white;padding:8px 12px;border-radius:9px;cursor:pointer}footer{text-align:center;border-top:1px solid var(--line);padding:25px;color:var(--muted);margin-top:45px}[hidden]{display:none!important}@media(max-width:500px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.card{padding:13px}.logo{font-size:21px}}
</style></head><body><header><a class="logo" href="#top">PLAYZOONN</a><select id="language" aria-label="Langue"><option value="fr">Français</option><option value="en">English</option></select></header><main id="top"><section class="hero"><h1 id="heading"></h1><p id="intro"></p><input id="search" type="search" aria-label="Rechercher"></section><section><h2 id="categoryHeading"></h2><div id="categories" class="grid"></div></section><section id="resources"><div class="toolbar"><h2 id="resourceHeading"></h2><button class="reset" id="reset" hidden></button></div><div id="items" class="grid"></div><p id="empty" hidden></p></section></main><footer id="footer"></footer><script>
const categories=[["news","📰","Actualités","News"],["creators","🎥","Créateurs","Creators"],["tools","🛠️","Outils / Glitch","Tools / Glitches"],["maps","🗺️","Maps","Maps"],["sites","🌐","Sites web","Websites"]];
const resources=[["news","Rockstar Newswire","https://www.rockstargames.com/newswire","Actualités officielles Rockstar"],["news","Rockstar GTA VI","https://www.rockstargames.com/VI","Informations officielles GTA VI"],["news","IGN GTA VI","https://www.ign.com/games/grand-theft-auto-vi","Articles et actualités"],["news","GameSpot GTA VI","https://www.gamespot.com/games/grand-theft-auto-vi/","Actualités et analyses"],["news","GTA Base News","https://www.gtabase.com/","Dossiers et informations GTA"],["creators","Rockstar Games YouTube","https://www.youtube.com/@RockstarGames","Vidéos officielles"],["creators","GTA Series Videos","https://www.youtube.com/@GTASeriesVideos","Vidéos et guides GTA"],["creators","DarkViperAU","https://www.youtube.com/@DarkViperAU","Défis et analyses GTA"],["creators","TGG","https://www.youtube.com/@TGG_","Conseils et vidéos GTA"],["creators","Communauté GTA6","https://www.reddit.com/r/GTA6/","Discussions entre fans"],["tools","GTA Wiki","https://gta.fandom.com/wiki/Grand_Theft_Auto_Wiki","Encyclopédie et astuces GTA"],["tools","GTA Forums","https://gtaforums.com/","Techniques et échanges communautaires"],["tools","GTA Series Guides","https://www.youtube.com/@GTASeriesVideos","Guides vidéo"],["tools","GTA Base Guides","https://www.gtabase.com/","Dossiers et conseils"],["maps","GTAMap","https://gtamap.io/","Projet de carte communautaire"],["maps","GTA Base Maps","https://www.gtabase.com/","Cartes et lieux des jeux GTA"],["maps","GTA Wiki Locations","https://gta.fandom.com/wiki/Locations","Encyclopédie des lieux GTA"],["maps","Rockstar GTA VI World","https://www.rockstargames.com/VI","Présentation officielle de l'univers"],["sites","Rockstar Games","https://www.rockstargames.com/","Site officiel"],["sites","GTA Base","https://www.gtabase.com/","Base de données GTA"],["sites","GTA Forums","https://gtaforums.com/","Forum communautaire"],["sites","GTA Wiki","https://gta.fandom.com/","Wiki des jeux GTA"]];
const translations={fr:{heading:'Explore l’univers <span class="accent">GTA 6</span>',intro:'Actualités, créateurs, outils, cartes et sites utiles au même endroit.',categoryHeading:'Explorer les catégories',resourceHeading:'Ressources GTA 6',search:'Rechercher une ressource...',reset:'Tout afficher',empty:'Aucune ressource trouvée.',visit:'Voir la ressource ↗',footer:'© 2026 PLAYZOONN · Annuaire indépendant, non affilié à Rockstar Games.'},en:{heading:'Explore the <span class="accent">GTA 6</span> universe',intro:'News, creators, tools, maps and useful websites in one place.',categoryHeading:'Explore categories',resourceHeading:'GTA 6 resources',search:'Search resources...',reset:'Show all',empty:'No resources found.',visit:'Visit resource ↗',footer:'© 2026 PLAYZOONN · Independent directory, not affiliated with Rockstar Games.'}};
const $=id=>document.getElementById(id);let selected=null;
function render(){const lang=$('language').value,t=translations[lang],q=$('search').value.trim().toLowerCase();document.documentElement.lang=lang;$('heading').innerHTML=t.heading;for(const id of ['intro','categoryHeading','resourceHeading','empty','reset','footer'])$(id).textContent=t[id];$('search').placeholder=t.search;$('categories').replaceChildren();for(const c of categories){const b=document.createElement('button');b.type='button';b.className='card category';b.setAttribute('aria-pressed',String(selected===c[0]));const emoji=document.createElement('div');emoji.className='emoji';emoji.textContent=c[1];const title=document.createElement('strong');title.textContent=c[lang==='fr'?2:3];b.append(emoji,title);b.onclick=()=>{selected=selected===c[0]?null:c[0];render();$('resources').scrollIntoView({behavior:'smooth'})};$('categories').append(b)}$('items').replaceChildren();let count=0;for(const r of resources){if(selected&&r[0]!==selected)continue;const category=categories.find(c=>c[0]===r[0]);if(q&&![...r,...category].join(' ').toLowerCase().includes(q))continue;count++;const card=document.createElement('article');card.className='card resource';const tag=document.createElement('span');tag.className='tag';tag.textContent=category[lang==='fr'?2:3];const h=document.createElement('h3');h.textContent=r[1];const p=document.createElement('p');p.textContent=r[3];const a=document.createElement('a');a.href=r[2];a.target='_blank';a.rel='noopener noreferrer';a.textContent=t.visit;card.append(tag,h,p,a);$('items').append(card)}$('empty').hidden=count>0;$('reset').hidden=!selected&&!q}
$('language').onchange=render;$('search').oninput=render;$('reset').onclick=()=>{selected=null;$('search').value='';render()};render();
</script></body></html>
